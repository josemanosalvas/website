<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>José Manosalvas</title>
<meta name="description" content="Hola, I’m José. Say hello at hello@josemanosalvas.ch.">
<meta property="og:title" content="José Manosalvas">
<meta property="og:description" content="Say hello at hello@josemanosalvas.ch.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23F5F3EC'/%3E%3Cpath d='M6 22h20' stroke='%23191813' stroke-width='4'/%3E%3C/svg%3E">
<style>
  /* Everything this page needs, and nothing else. Faces and colours are
     Mitad's; the fonts are subset to the characters on the page and
     embedded by tools/build.py, which also minifies this file into
     ../index.html, the one that gets uploaded.
     Archivo, Literata and B612 Mono: SIL Open Font License 1.1, see OFL.txt. */

  /* fonts:start */
  /* fonts:end */

  :root {
    --bg: #F5F3EC;            /* Mitad Papel */
    --ink: #191813;           /* Mitad Tinta */
    --focus: #0C4CA8;         /* Mitad Azul */
    --aji: #D91E36;           /* accents appear only while the word changes */
    --sol: #F2B705;
    --guayas: #56B8DF;        /* Hola's glow: a light blue, so it reads as light */
    --sans: 'Archivo', 'Helvetica Neue', 'Arial', sans-serif;
    --serif: 'Literata', 'Georgia', serif;
    --mono: 'B612 Mono', 'Courier New', monospace;
    --gutter: clamp(1.5rem, min(5vw, 14svh), 4.5rem);
    --hello: min(33vw, 40svh, 20rem);   /* the widest state must fit */
    color-scheme: light;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161511;
      --ink: #EBE7DC;
      --focus: #56B8DF;       /* Mitad Guayas */
      --aji: #F0596B;
      color-scheme: dark;
    }
  }

  *, ::before, ::after { box-sizing: border-box; }
  * { margin: 0; }

  html {
    height: 100%;
    background: var(--bg);
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
    font-synthesis: none;
  }

  body {
    display: grid;
    grid-template-columns: minmax(0, 1fr);   /* a wide glyph can't stretch the page */
    grid-template-rows: minmax(min-content, 1fr) minmax(min-content, 1fr);
    height: 100%;
    min-height: 100svh;
    font: 1.125rem/1.5rem var(--sans);
    font-kerning: normal;
    color: var(--ink);
    background: var(--bg);
  }

  .fonts-pending body { visibility: hidden; }

  ::selection { background: #F2B705; color: #191813; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  /* ---------- above the horizon ---------- */
  .north {
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: var(--gutter) var(--gutter) 0;
    padding-top: max(var(--gutter), env(safe-area-inset-top));
    overflow-x: clip;
  }

  /* The word's baseline is the horizon and anything below it is cut, so
     nothing in the word or on the stage ever touches the name. */
  h1 {
    position: relative;
    font-size: var(--hello);
    line-height: 1;
    letter-spacing: -0.045em;
    margin-left: -0.06em;            /* optical: pull the stem to the margin */
    height: 0.8em;                   /* ascent only: baseline = bottom edge */
    clip-path: inset(-1em -1em -0.025em -1em);   /* keep round overshoot whole */
    white-space: nowrap;
  }

  .word {
    display: inline-block;
    position: relative;
    font-weight: 800;
  }

  /* Once the page is set up, each letter is a slot on its own layer and stays one, so
     nothing is re-rasterised when a word comes to rest. A slot has no width: it's placed
     by its centre, so nothing reflows and the title can't grow. */
  .word.live > span {
    position: absolute;
    left: 0;
    top: 0;
    width: 0;
    display: flex;
    justify-content: center;
    transform-origin: 0 80%;
    will-change: transform;
  }

  /* On the way, a letter passes through the page's other two faces, both set a little smaller
     on the same baseline, so they sit among the others like letters of the word. */
  .word .i { font: italic 800 .94em/1 'Literata Display', var(--serif); letter-spacing: 0; }
  .word .m { font: 700 .9em/1 var(--mono); letter-spacing: 0; }
  .word.live > .i { top: .051em; }
  .word.live > .m { top: .089em; }
  .word .x { -webkit-text-stroke: .047em currentColor; }   /* the Swiss cross, at the word's own stem weight */

  /* A second l in the l's slot, which rises out of the first as the flagpole: the l is a
     plain rectangle, so the two overlap with no seam. */
  .word .mast {
    position: absolute;
    left: 0;
    top: 0;
    width: 0;
    display: flex;
    justify-content: center;
    visibility: hidden;
  }
  .r { color: var(--aji); }
  .b { color: var(--focus); }
  .y { color: var(--sol); }

  /* The stage carries what type can't: the liquid letter, the animal and the flag. */
  canvas {
    position: absolute;
    pointer-events: none;
  }

  /* ---------- below the horizon ---------- */
  .south {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 1.5rem var(--gutter) var(--gutter);
    padding-bottom: max(var(--gutter), env(safe-area-inset-bottom));
  }

  .name {
    margin-bottom: 0.75rem;
    font-weight: 300;
    font-size: clamp(2rem, min(7vw, 11svh), 4.5rem);
    line-height: 1.1;
    letter-spacing: -0.02em;
  }

  a {
    color: inherit;
    text-decoration-thickness: 1px;
    text-underline-offset: 0.18em;
  }

  a:hover { text-decoration-thickness: 2px; }


  .hello {
    font-family: var(--serif);
    font-style: italic;
    font-size: clamp(1.25rem, 3vw, 1.75rem);
    line-height: 1.3;
    overflow-wrap: anywhere;
  }

  .elsewhere { text-align: right; }

  .elsewhere a {
    font: 0.75rem/1.5rem var(--mono);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }

</style>
<script>
  /* Start decoding all three fonts now and reveal the page in one frame when
     they are ready, so nothing paints in pieces (under font-display: block,
     text waits for its own font but underlines don't, and faces finish at
     different times). Without JS nothing is hidden; after 3s it shows anyway. */
  (() => {
    const root = document.documentElement;
    root.classList.add('fonts-pending');
    window.pageReady = new Promise((ready) => {
      const show = () => { root.classList.remove('fonts-pending'); ready(); };
      Promise.all(['800 1em Archivo', 'italic 1em Literata', 'italic 800 1em "Literata Display"', '1em "B612 Mono"', '700 1em "B612 Mono"'].map((f) => document.fonts.load(f)))
        .finally(show);
      setTimeout(show, 3000);
    });
  })();
</script>
</head>
<body>
  <header class="north">
    <h1><span class="word" aria-hidden="true">Hola</span><span class="visually-hidden"><span lang="es">Hola</span>, I’m José.</span></h1>
  </header>

  <main class="south">
    <div>
      <p class="name" aria-hidden="true">I’m José.</p>
      <p class="hello"><a href="mailto:hello@josemanosalvas.ch">hello@josemanosalvas.ch</a></p>
    </div>
    <p class="elsewhere"><a href="https://github.com/josemanosalvas">GitHub</a></p>
  </main>

<script>
  (() => {
    // Each greeting has its word, and two sets of glyphs its second letter passes through,
    // from its own language, with their faces and colours. They're taken in turn, so the
    // fourth change isn't the second again. Each is close to the width of the letter it stands
    // in for, so the word keeps its spacing. Then the letter its first letter turns italic as,
    // H for both, since an italic S is far narrower than Archivo's; the glyph its last letter
    // shows before the animal lands, the é of José; and the colour its liquid letter is poured
    // in: Hola's blue, Salü's red, the page's own accents, so the lacquer and the flat letters
    // share one blue and one red in either theme. Then its animal, which takes its last
    // letter's place and size, and its flag and how tall that is, the square Swiss one smaller
    // so it clears the ü. 🐢 is from the Galápagos. Salü's animal is the white Swiss shepherd,
    // which no system has: a strip of four poses rendered from the 3D model in
    // tools/shepherd.html, and its act says which pose it holds from which frame: hit, happy,
    // looking up at the pole, flung. Nudges are optical, in em: they kern H–o, and set the l of
    // both words in the same place, so the l never moves. The rectangles are the flag for
    // systems that have no flag emoji, at 50 px to the unit.
    const greetings = [
      {
        word: 'Hola', steps: [[['ñ', 'b'], ['á', 'i y'], ['ó', 'm r']], [['ñ', 'r'], ['á', 'i b'], ['ó', 'm y']]], tail: ['é', 'm b'], slant: 'H', paint: '--focus', glow: '--guayas',
        mark: '🐢', flag: '🇪🇨', fly: .26, nudge: [0, -.015, -.019, -.019],
        rects: [[0, 0, 3, 1, '#FFDD00'], [0, 1, 3, .5, '#034EA2'], [0, 1.5, 3, .5, '#D91E36']],
      },
      {
        word: 'Salü', steps: [[['+', 'r x'], ['ä', 'i r'], ['ö', 'm r']], [['ö', 'm r'], ['ä', 'i r'], ['+', 'r x']]], tail: ['é', 'm r'], slant: 'H', paint: '--aji', glow: '--aji',
        mark: 'shepherd.avif', poses: 4, act: [[6, 1], [13, 0], [17, 1], [30, 2], [34, 3]], flag: '🇨🇭', fly: .23, nudge: [.024, .0527, .0904, .0684],
        rects: [[0, 0, 2, 2, '#D91E36'], [.8, .35, .4, 1.3, '#FFF'], [.35, .8, 1.3, .4, '#FFF']],
      },
    ];

    // One score for every change, in frames at 60 fps from its start, so a display at any
    // rate lands on the same beats. A note is frame, slot, glyph, faces. It runs fast and then
    // slower, the way a thrown thing settles. First a burst of hard cuts, one letter at a time,
    // two frames apart: the second letter passes through glyphs from its own language in the
    // page's other two faces, and the first letter turns italic. The first letter becomes its
    // own 3D model, in clay, then lacquer; the animal slides out from behind the l. The second
    // letter comes back glowing in the word's colour, and the model is un-built along its own
    // strokes, a wireframe running ahead of the ink. Then the l shoots up into a pole and flings
    // the animal away, the last letter lands, and the flag unfurls from behind the pole. The l
    // never changes and never moves: it's the same letter in both words, so the word never
    // leaves. The glow fades, the flag goes back in, and the pole drops.
    const score = ({ word: [first, second, , last], tail, slant }, steps) => [
      [0, 1, ...steps[0]],
      [0, 3, ...tail],
      [2, 0, slant, 'i'],
      [4, 1, ...steps[1]],
      [8, 1, ...steps[2]],
      [8, 0, first, ''],
      [18, 1, second, ''],
      [land, 3, last, ''],
    ];
    const peek = [6, 14], perk = [21, 26];        // the animal slides out from behind the l, and hops once
    const coat = [8, 40], gloss = 16;             // the first letter is a model in clay, then lacquer,
    const unbuild = [26, 40];                     // and is un-built into ink along its strokes
    const glow = [18, 60];                        // the second letter comes back glowing, and the glow fades
    const aside = [2, 7, 8, 22];                  // the first letter steps aside for the italic H, and glides home
    const land = 37;                              // the last letter lands
    const raise = [34, 42], launch = [34, 38];    // the l shoots up and flings the animal out of its slot
    const open = [37, 58];                        // the flag unfurls from behind the pole as the word lands
    const close = [80, 85], lower = [83, 95];     // then goes back in, quickly, as the pole drops

    // A visit opens with two changes, to Salü and back, a change and a rest apart, and then the
    // word stays. That's all over within five seconds of the first move. Pointing at the word, or
    // tapping it, plays one more.
    const every = 3000, opening = 2;

    const word = document.querySelector('.word');
    const heading = document.querySelector('h1');
    const reduce = matchMedia('(prefers-reduced-motion: reduce)');
    const clamp = (x) => (x < 0 ? 0 : x > 1 ? 1 : x);
    const span = (t, [a, b]) => clamp((t - a) / (b - a));
    const smooth = (x) => x * x * (3 - 2 * x);
    const out = (x) => 1 - (1 - x) ** 3;
    const spring = (x) => 1 - Math.exp(-7 * x) * Math.cos(11 * x);
    const drop = (x) => (x < .5 ? (x / .5) ** 2 : 1 - .025 * Math.sin((x - .5) / .5 * 3.14));   // falls, and bounces a little
    const pop = (x, a = .1) => (x > 3 ? 1 : 1 - a * Math.exp(-x) * Math.cos(x * 1.2));   // frames since a cut
    const bump = (x, n = 9) => (x > 0 && x < n ? Math.sin(x * 3.14 / n) : 0);
    const mix = (a, b, x) => a + (b - a) * x;
    const hex = (colour) => colour.match(/\w\w/g).map((h) => parseInt(h, 16) / 255);

    // ---------- the stage ----------
    // WebGL carries what type can't: the liquid letter, the emoji and the flag. It's two
    // small shaders and it's only used here, so without it the letters still change.
    let gl, liquid, cloth;

    const quad = `#version 300 es
uniform vec4 Q;uniform vec2 S;uniform float R;in vec2 p;out vec2 v;
void main(){v=p;vec2 d=mat2(cos(R),sin(R),-sin(R),cos(R))*((p-.5)*Q.zw),c=(Q.xy+Q.zw*.5+d)/S*2.-1.;gl_Position=vec4(c.x,-c.y,0,1);}`;

    // The letter's 3D model, a rounded copy of it, in two materials and then un-built. Clay:
    // matte, in a pastel of its colour, lit softly from the upper left. Lacquer: a soft room in
    // the letter's own colour, a sharp key light with a soft halo, a strip, a top light and a
    // rim, all shades of one hue. M takes it from clay to lacquer. P inflates it and L tilts it,
    // so the light travels; its slope comes from its height, in the alpha channel. Then the
    // letter itself, in ink K, appears behind it, G of the way in, and a front runs along the
    // letter's strokes, F of the way: behind it the model is gone, and just behind it the tube
    // is a fading wireframe, rings across the stroke and lines along it, B being its radius.
    const liquidShader = `#version 300 es
precision highp float;
uniform sampler2D T;uniform float P,M,F,B,G;uniform vec2 L;uniform vec3 I[3],K;in vec2 v;out vec4 o;
float l(vec3 r,vec3 d,float s){return pow(max(dot(r,normalize(d)),0.),s);}
float grid(float x){float f=abs(fract(x)-.5),w=fwidth(x);return smoothstep(.5-w*1.4,.5-w*.3,f);}
float cover(float x){float w=fwidth(x)*.5;return smoothstep(.5-w,.5+w,x);}
void main(){vec4 t=texture(T,v);const float e1=1./256.;
vec2 g=clamp(vec2(texture(T,v-vec2(e1,0)).a-texture(T,v+vec2(e1,0)).a,texture(T,v-vec2(0,e1)).a-texture(T,v+vec2(0,e1)).a)*.5,-6.,6.);
vec3 n=normalize(vec3((g+L)*P,1.)),r=reflect(vec3(0,0,-1),n);float y=-r.y,x=(y+.3)/.12;
vec3 c=mix(I[0],I[1],smoothstep(-.55,.75,y));c=mix(c,I[0]*1.8,smoothstep(0.,.9,-y)*.55);c*=1.-.12*exp(-x*x);
c=mix(c,I[2],pow(1.-n.z,2.6)*.85);c+=1.1*l(r,vec3(-.32,-.42,.85),110.)+.18*l(r,vec3(-.32,-.42,.85),10.)+.45*l(r,vec3(.75,-.1,.5),40.)+.5*l(r,vec3(.1,-.75,.6),70.);
float d=max(dot(n,normalize(vec3(-.35,-.55,.76))),0.);vec3 p=mix(I[1],vec3(1),.55),m=p*(.64+.44*d)+.1*l(r,vec3(-.32,-.42,.85),9.);
c=mix(mix(m,p*.8,pow(1.-n.z,2.)*.3),min(c,vec3(1)),M);
float s=t.b,e=fwidth(s)+.002,b=.3,h=acos(clamp(1.-(t.g-.5)/B,-1.,1.));
vec3 f=mix(vec3(.93,.93,.94)*(.8+.22*d),vec3(.42,.42,.46),max(grid(s*24.),grid(h*5.73))*.9)*mix(.74,1.,smoothstep(0.,.7,n.z));
float on=smoothstep(F-e,F+e,s),wire=smoothstep(F-b,F-b*.35,s)*(1.-on),at=cover(t.g)*(on+wire),ai=cover(t.r)*G;
c=(on*(c+.3*exp(-pow((s-F)/.01,2.)))+wire*f)/max(on+wire,1e-4);
o=vec4(min(c,vec3(1))*at+K*ai*(1.-at),at+ai*(1.-at));}`;

    // An emoji, or a flag: A is the height of its wave, and U how much of it is out of the
    // pole, so it never squeezes. E is where the pole is, and nothing shows behind it. Nothing is drawn past the sprite's own edges, so its last
    // row of pixels can't smear below it.
    const clothShader = `#version 300 es
precision highp float;
uniform sampler2D T;uniform float U,A,W,E;in vec2 v;out vec4 o;
void main(){float x=v.x+1.-U,s=v.x*7.-W,e=pow(max(v.x,0.),1.2),y=(v.y-.5)*1.3+.5+A*e*sin(s);vec4 c=texture(T,vec2(x,y));
c.rgb*=1.+A*2.4*e*cos(s);o=c*step(0.,y)*step(y,1.)*step(x,1.)*step(E,v.x);}`;

    function program(fragment) {
      const p = gl.createProgram();
      [[gl.VERTEX_SHADER, quad], [gl.FRAGMENT_SHADER, fragment]].forEach(([type, src]) => {
        const s = gl.createShader(type);
        gl.shaderSource(s, src);
        gl.compileShader(s);
        gl.attachShader(p, s);
      });
      gl.bindAttribLocation(p, 0, 'p');
      gl.linkProgram(p);
      const u = { p };
      for (const n of 'QSRPLIUAWEMFBKG') u[n] = gl.getUniformLocation(p, n);
      return u;
    }

    function texture(upload) {
      const t = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, t);
      upload();
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      return t;
    }

    // The letter comes from the page's own font, as a round tube: every stroke is a half
    // cylinder as wide as the letter's heaviest stroke, so one highlight runs unbroken along
    // each stroke and the rim lights all the way round. The outline is the font's own, from the
    // distance to its edge, so it stays sharp at any size. Stored as outline and slope.
    function inflate(letter) {
      const N = 256, c = document.createElement('canvas');
      c.width = c.height = N;
      const x = c.getContext('2d', { willReadFrequently: true });
      x.font = `800 ${N / 1.25}px Archivo`;
      x.fillText(letter, 51, 205);                  // whole cells: canvases round text to them
      const a = x.getImageData(0, 0, N, N).data, ink = new Float32Array(N * N);
      for (let i = 0; i < N * N; i++) ink[i] = a[i * 4 + 3] / 255;
      // Squared distance to the nearest pixel where `far` is false, in two passes of the
      // exact one-dimensional transform (Felzenszwalb and Huttenlocher).
      const distance = (far) => {
        const g = new Float64Array(N * N), f = new Float64Array(N), d = new Float64Array(N), v = new Int32Array(N), z = new Float64Array(N + 1);
        for (let i = 0; i < N * N; i++) g[i] = far(i) ? 1e20 : 0;
        const line = (at, step) => {
          for (let q = 0; q < N; q++) f[q] = g[at + q * step];
          let k = 0; v[0] = 0; z[0] = -1e20; z[1] = 1e20;
          for (let q = 1; q < N; q++) {
            let s;
            while ((s = (f[q] + q * q - f[v[k]] - v[k] * v[k]) / (2 * q - 2 * v[k])) <= z[k]) k--;
            v[++k] = q; z[k] = s; z[k + 1] = 1e20;
          }
          for (let q = 0, j = 0; q < N; q++) { while (z[j + 1] < q) j++; d[q] = (q - v[j]) ** 2 + f[v[j]]; }
          for (let q = 0; q < N; q++) g[at + q * step] = d[q];
        };
        for (let i = 0; i < N; i++) line(i, N);
        for (let i = 0; i < N; i++) line(i * N, 1);
        return g;
      };
      const inside = distance((i) => ink[i] >= .5), outside = distance((i) => ink[i] < .5);
      // Signed distance to the edge, in pixels, with the edge pixels' own coverage for the last half pixel.
      const edge = ink.map((q, i) => (q > 0 && q < 1 ? q - .5 : q >= .5 ? Math.sqrt(inside[i]) - .5 : .5 - Math.sqrt(outside[i])));
      const pass = (from, r, step) => {
        const to = new Float32Array(N * N);
        for (let i = 0; i < N * N; i++) {
          let s = 0;
          for (let k = -r; k <= r; k++) s += from[i + k * step] ?? from[i];
          to[i] = s / (2 * r + 1);
        }
        return to;
      };
      const blur = (from, r) => pass(pass(from, r, 1), r, N);
      const outline = blur(edge, 1);
      let R = 1;
      for (const e of outline) R = Math.max(R, e);
      // The model is a rounded copy of the letter: the letter opened by a disc of three fifths of
      // its heaviest half stroke, so stems end in round caps and terminals round off while every
      // stroke keeps its width. Its outline is the distance to the letter shrunk by that disc.
      const r = R * .6, core = distance((i) => !(edge[i] > r)), round = blur(core.map((d) => r - Math.sqrt(d)), 1);
      // It's a balloon blown into that shape: the steady pressure against its outline, Poisson's
      // equation solved by over-relaxation. Its square root makes every stroke a round tube as
      // wide as the stroke, with nothing to crease.
      const p = new Float32Array(N * N);
      for (let k = 0; k < 160; k++) {
        for (let y = 1; y < N - 1; y++) {
          for (let i = y * N + 1 + ((y + k) & 1); i < y * N + N - 1; i += 2) {
            if (round[i] > 0) p[i] += 1.9 * ((p[i - 1] + p[i + 1] + p[i - N] + p[i + N] + 2) / 4 - p[i]);
          }
        }
      }
      const z = blur(p.map((q) => Math.sqrt(Math.max(q, 0))), 1);
      // How far along its own strokes each point of the letter is from where the pen would start,
      // its lowest leftmost point: the path the model is un-built along, as Dijkstra's walk
      // through the letter, 0 at the start and 1 at the far end.
      const along = new Float64Array(N * N).fill(Infinity), heap = [];
      let seed = 0;
      for (let i = 0; i < N * N; i++) if (ink[i] >= .5 && (i / N | 0) - i % N > (seed / N | 0) - seed % N) seed = i;
      const push = (d, i) => {

            const x = (foot - travel * -(2.2 * q * q * q + 1.2 * q * q) + .32 * go + .22 * go * go + side) * px;
            const y = base - (.07 * bump(t - perk[0], perk[1] - perk[0]) + fling * out(go) + .18 * go * go) * px;
            const left = x - w * (box[0] + box[2]) / 2;
            put(cloth, look.tex, left, y - tall * (look.ink[3] + .15), w, tall * 1.3);   // each pose stands on its own foot
            gl.uniform1f(cloth.R, .45 * go);
            gl.uniform1f(cloth.U, 1);
            gl.uniform1f(cloth.A, 0);
            gl.uniform1f(cloth.W, 0);
            gl.uniform1f(cloth.E, Math.max(0, ((post + side) * px - left) / w));
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
          }

          // The flag unfurls from behind the pole as the word lands, fast and then slowly, rides
          // it, waves, and goes back in. Its ink hangs from the top of the pole.
          const u = out(span(t, open)) * (1 - smooth(span(t, close)));
          if (flagged && u > 0) {
            const [inset, top0, , bottom0] = g.banner.ink, tall = fh / (bottom0 - top0), w = tall * g.banner.aspect;
            const hoist = (xs[2] + .1045 + side) * px, top = base - (.724 + rise * pole) * px;
            put(cloth, g.banner.tex, hoist - w * inset, top - tall * (top0 + .15), w, tall * 1.3);
            gl.uniform1f(cloth.R, 0);
            gl.uniform1f(cloth.U, u);
            gl.uniform1f(cloth.A, .065 + .08 * (1 - span(t, [open[0], open[1] + 10])));
            gl.uniform1f(cloth.W, t * .24);
            gl.uniform1f(cloth.E, inset);
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
          }
        }

        if (t < last) requestAnimationFrame(tick);
        else {
          stage.hidden = true;
          current = i;
          busy = false;
        }
      };
      requestAnimationFrame(tick);
    }

    // The opening plays its changes a change and a rest apart. A tab opened in the background
    // waits, and plays the opening when it's first seen.
    let timer = null, left = opening;
    const next = () => { if (!busy) play((current + 1) % greetings.length); };
    function run() {
      timer = null;
      if (!left || reduce.matches || document.hidden) return;
      left--;
      next();
      if (left) timer = setTimeout(run, every);
    }
    document.addEventListener('visibilitychange', () => {
      clearTimeout(timer);
      timer = !document.hidden && left ? setTimeout(run, 700) : null;
    });

    // After the opening, pointing at the word or tapping it plays one more change.
    word.addEventListener('pointerenter', (e) => { if (e.pointerType === 'mouse' && !left && !reduce.matches) next(); });
    word.addEventListener('click', () => { if (!left && !reduce.matches) next(); });

    if (reduce.matches) return;
    pageReady.then(() => {
      slots ??= letters(greetings[current]);       // before the page is first painted, so nothing moves
      ready().then(() => { if (!document.hidden && left && !timer) timer = setTimeout(run, 700); });
    });
  })();
</script>
</body>
</html>
