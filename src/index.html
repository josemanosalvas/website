<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>José Manosalvas</title>
<meta name="description" content="Hola, I’m José. Say hello at hello@josemanosalvas.ch.">
<meta property="og:title" content="José Manosalvas">
<meta property="og:description" content="Say hello at hello@josemanosalvas.ch.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23F5F3EC'/%3E%3Cpath d='M6 22h20' stroke='%23191813' stroke-width='4'/%3E%3C/svg%3E">
<style>
  /* Everything this page needs, and nothing else. Faces and colours are
     Mitad's; the fonts are subset to the characters on the page and
     embedded by tools/build.py, which also minifies this file into
     ../index.html, the one that gets uploaded.
     Archivo, Literata and B612 Mono: SIL Open Font License 1.1, see OFL.txt. */

  /* fonts:start */
  /* fonts:end */

  :root {
    --bg: #F5F3EC;            /* Mitad Papel */
    --ink: #191813;           /* Mitad Tinta */
    --focus: #0C4CA8;         /* Mitad Azul */
    --aji: #D91E36;           /* accents appear only while the word changes */
    --sol: #F2B705;
    --sans: 'Archivo', 'Helvetica Neue', 'Arial', sans-serif;
    --serif: 'Literata', 'Georgia', serif;
    --mono: 'B612 Mono', 'Courier New', monospace;
    --gutter: clamp(1.5rem, min(5vw, 14svh), 4.5rem);
    --hello: min(33vw, 40svh, 20rem);   /* the widest state must fit */
    color-scheme: light;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161511;
      --ink: #EBE7DC;
      --focus: #56B8DF;       /* Mitad Guayas */
      --aji: #F0596B;
      color-scheme: dark;
    }
  }

  *, ::before, ::after { box-sizing: border-box; }
  * { margin: 0; }

  html {
    height: 100%;
    background: var(--bg);
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
    font-synthesis: none;
  }

  body {
    display: grid;
    grid-template-columns: minmax(0, 1fr);   /* a wide glyph can't stretch the page */
    grid-template-rows: minmax(min-content, 1fr) minmax(min-content, 1fr);
    height: 100%;
    min-height: 100svh;
    font: 1.125rem/1.5rem var(--sans);
    font-kerning: normal;
    color: var(--ink);
    background: var(--bg);
  }

  .fonts-pending body { visibility: hidden; }

  ::selection { background: #F2B705; color: #191813; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  /* ---------- above the horizon ---------- */
  .north {
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: var(--gutter) var(--gutter) 0;
    padding-top: max(var(--gutter), env(safe-area-inset-top));
    overflow-x: clip;
  }

  /* The word's baseline is the horizon and anything below it is cut, so
     nothing in the word or on the stage ever touches the name. */
  h1 {
    position: relative;
    font-size: var(--hello);
    line-height: 1;
    letter-spacing: -0.045em;
    margin-left: -0.06em;            /* optical: pull the stem to the margin */
    height: 0.8em;                   /* ascent only: baseline = bottom edge */
    clip-path: inset(-1em -1em -0.025em -1em);   /* keep round overshoot whole */
    white-space: nowrap;
  }

  .word {
    display: inline-block;
    position: relative;
    font-weight: 800;
  }

  /* After the first change, each letter is a slot on its own layer and stays one, so
     nothing is re-rasterised when a word comes to rest. A slot has no width: it's placed
     by its centre, so nothing reflows and the title can't grow. The l also grows into the
     flagpole: it's a plain rectangle, so stretching it from the baseline has no seam. */
  .word.live > span {
    position: absolute;
    left: 0;
    top: 0;
    width: 0;
    display: flex;
    justify-content: center;
    transform-origin: 0 80%;
    will-change: transform;
  }

  /* On the way, a letter passes through the page's other two faces, both set a little smaller
     on the same baseline, so they sit among the others like letters of the word. */
  .word .i { font: italic 400 .94em/1 'Literata Display', var(--serif); letter-spacing: 0; }
  .word .m { font: 700 .9em/1 var(--mono); letter-spacing: 0; }
  .word.live > .i { top: .051em; }
  .word.live > .m { top: .089em; }
  .r { color: var(--aji); }
  .b { color: var(--focus); }
  .y { color: var(--sol); }

  /* The stage carries what type can't: the liquid letter, the animal and the flag. */
  canvas {
    position: absolute;
    pointer-events: none;
  }

  /* ---------- below the horizon ---------- */
  .south {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 1.5rem var(--gutter) var(--gutter);
    padding-bottom: max(var(--gutter), env(safe-area-inset-bottom));
  }

  .name {
    margin-bottom: 0.75rem;
    font-weight: 300;
    font-size: clamp(2rem, min(7vw, 11svh), 4.5rem);
    line-height: 1.1;
    letter-spacing: -0.02em;
  }

  a {
    color: inherit;
    text-decoration-thickness: 1px;
    text-underline-offset: 0.18em;
  }

  a:hover { text-decoration-thickness: 2px; }


  .hello {
    font-family: var(--serif);
    font-style: italic;
    font-size: clamp(1.25rem, 3vw, 1.75rem);
    line-height: 1.3;
    overflow-wrap: anywhere;
  }

  .elsewhere { text-align: right; }

  .elsewhere a {
    font: 0.75rem/1.5rem var(--mono);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }

</style>
<script>
  /* Start decoding all three fonts now and reveal the page in one frame when
     they are ready, so nothing paints in pieces (under font-display: block,
     text waits for its own font but underlines don't, and faces finish at
     different times). Without JS nothing is hidden; after 3s it shows anyway. */
  (() => {
    const root = document.documentElement;
    root.classList.add('fonts-pending');
    window.pageReady = new Promise((ready) => {
      const show = () => { root.classList.remove('fonts-pending'); ready(); };
      Promise.all(['800 1em Archivo', 'italic 1em Literata', 'italic 1em "Literata Display"', '1em "B612 Mono"', '700 1em "B612 Mono"'].map((f) => document.fonts.load(f)))
        .finally(show);
      setTimeout(show, 3000);
    });
  })();
</script>
</head>
<body>
  <header class="north">
    <h1><span class="word" aria-hidden="true">Hola</span><span class="visually-hidden"><span lang="es">Hola</span>, I’m José.</span></h1>
  </header>

  <main class="south">
    <div>
      <p class="name" aria-hidden="true">I’m José.</p>
      <p class="hello"><a href="mailto:hello@josemanosalvas.ch">hello@josemanosalvas.ch</a></p>
    </div>
    <p class="elsewhere"><a href="https://github.com/josemanosalvas">GitHub</a></p>
  </main>

<script>
  (() => {
    // Each greeting has its word, and two sets of glyphs its second letter passes through,
    // from its own language, with their faces and colours. They're taken in turn, so the
    // fourth change isn't the second again. Each is close to the width of the letter it stands
    // in for, so the word keeps its spacing. Then the letter its first letter turns italic as,
    // H for both, since an italic S is far narrower than Archivo's; the glyph its last letter
    // shows before the animal lands, the é of José; and the colours of its liquid letter, also in turn: Hola's
    // runs through its flag's blue and red, in Mitad's Azul and Ají at full strength in both
    // themes, so the lacquer stays deep on dark paper, while Salü stays Swiss. Then its animal
    // and how tall that is in em, and its flag and how tall that is, the square Swiss one
    // smaller so it clears the ü. 🐢 is from the Galápagos. Salü's animal is the white Swiss
    // shepherd, which no system has: a strip of six poses rendered from the 3D model in
    // tools/shepherd.html, and its act says which pose it holds from which frame: hit, ears
    // up, at rest, a curious tilt, looking up at the pole, flung. Nudges are optical, in em.
    // The rectangles are the flag for systems that have no flag emoji, at 50 px to the unit.
    const greetings = [
      {
        word: 'Hola', steps: [[['ñ', 'b'], ['á', 'i y'], ['ó', 'm r']], [['ñ', 'r'], ['á', 'i b'], ['ó', 'm y']]], tail: ['é', 'm b'], slant: 'H', paint: ['#0C4CA8', '#D91E36'],
        mark: '🐢', size: .44, flag: '🇪🇨', fly: .3, nudge: [0, 0, 0, 0],
        rects: [[0, 0, 3, 1, '#FFDD00'], [0, 1, 3, .5, '#034EA2'], [0, 1.5, 3, .5, '#D91E36']],
      },
      {
        word: 'Salü', steps: [[['+', 'r'], ['ä', 'i r'], ['ö', 'm r']], [['ö', 'm r'], ['ä', 'i r'], ['+', 'r']]], tail: ['é', 'm r'], slant: 'H', paint: ['#D91E36', '#D91E36'],
        mark: 'shepherd.avif', poses: 6, act: [[4, 1], [7, 2], [11, 0], [13, 3], [17, 4], [19, 5]], size: .52, flag: '🇨🇭', fly: .26, nudge: [.024, .039, .063, .041],
        rects: [[0, 0, 2, 2, '#D91E36'], [.8, .35, .4, 1.3, '#FFF'], [.35, .8, 1.3, .4, '#FFF']],
      },
    ];

    // One score for every change, in frames at 60 fps from its start, so a display at any
    // rate lands on the same beats. A note is frame, slot, glyph, faces. It's two bursts and
    // an accent. First hard cuts two frames apart, often two letters on the same frame, each
    // letter passing through other glyphs in the page's other two faces, the first ending in
    // liquid lacquer and the last in an animal; then a breath while the light crosses the
    // lacquer, the animal hops and the second letter flicks once. Then the l shoots up into a
    // pole and flings the animal up and away, and on its last frame the first letter cuts to
    // ink and the last letter lands where it was. The l never changes and never moves: it's
    // the same letter in both words, so the word never leaves. As the word lands, the flag eases
    // out of the pole. It snaps once in the wind, goes back in, and the pole drops.
    const score = ({ word: [first, second, , last], tail, slant }, steps) => [
      [0, 1, ...steps[0]],
      [0, 3, ...tail],
      [2, 0, slant, 'i'],
      [4, 1, ...steps[1]],
      [8, 1, ...steps[2]],
      [11, 1, second, ''],
      [15, 1, ...steps[2]],
      [17, 1, second, ''],
      [21, 0, first, ''],
      [21, 3, last, ''],
    ];
    const enter = 4, perk = [12, 16];             // the animal lands in the last slot, and hops once
    const coat = [8, 21];                         // the first letter is poured in lacquer, and cuts to ink
    const raise = [18, 26], launch = [18, 22];    // the l shoots up and flings the animal out of its slot
    const open = [23, 33], gust = [37, 43];       // the flag eases out of the pole as the word lands, and snaps once
    const close = [47, 51], lower = [51, 63];     // then goes back in, quickly, and the pole drops
    const every = 1570;

    const word = document.querySelector('.word');
    const heading = document.querySelector('h1');
    const reduce = matchMedia('(prefers-reduced-motion: reduce)');
    const clamp = (x) => (x < 0 ? 0 : x > 1 ? 1 : x);
    const span = (t, [a, b]) => clamp((t - a) / (b - a));
    const smooth = (x) => x * x * (3 - 2 * x);
    const out = (x) => 1 - (1 - x) ** 3;
    const spring = (x) => 1 - Math.exp(-7 * x) * Math.cos(11 * x);
    const drop = (x) => (x < .5 ? (x / .5) ** 2 : 1 + .07 * Math.sin((x - .5) / .5 * 3.14));   // falls, and dips
    const pop = (x, a = .1) => (x > 3 ? 1 : 1 - a * Math.exp(-x) * Math.cos(x * 1.2));   // frames since a cut
    const slam = (x) => (x > 12 ? 1 : 1 + .12 * Math.exp(-x / 3) * Math.cos(x / 2.4));
    const bump = (x, n = 9) => (x > 0 && x < n ? Math.sin(x * 3.14 / n) : 0);
    const mix = (a, b, x) => a + (b - a) * x;
    const hex = (colour) => colour.match(/\w\w/g).map((h) => parseInt(h, 16) / 255);

    // ---------- the stage ----------
    // WebGL carries what type can't: the liquid letter, the emoji and the flag. It's two
    // small shaders and it's only used here, so without it the letters still change.
    let gl, liquid, cloth;

    const quad = `#version 300 es
uniform vec4 Q;uniform vec2 S;uniform float R;in vec2 p;out vec2 v;
void main(){v=p;vec2 d=mat2(cos(R),sin(R),-sin(R),cos(R))*((p-.5)*Q.zw),c=(Q.xy+Q.zw*.5+d)/S*2.-1.;gl_Position=vec4(c.x,-c.y,0,1);}`;

    // Lacquer: a soft room in the letter's own colour, a sharp key light with a soft halo, a
    // strip, a top light and a rim, all shades of one hue.
    // P inflates it and L tilts it, so the light travels.
    const liquidShader = `#version 300 es
precision highp float;
uniform sampler2D T;uniform float P;uniform vec2 L;uniform vec3 I[3];in vec2 v;out vec4 o;
float l(vec3 r,vec3 d,float s){return pow(max(dot(r,normalize(d)),0.),s);}
void main(){vec4 t=texture(T,v);float w=fwidth(t.r)*.5,a=smoothstep(.5-w,.5+w,t.r);
vec3 n=normalize(vec3((t.ba+L)*P,1.)),r=reflect(vec3(0,0,-1),n);float y=-r.y,x=(y+.3)/.12;
vec3 c=mix(I[0],I[1],smoothstep(-.55,.75,y));c=mix(c,I[0]*1.8,smoothstep(0.,.9,-y)*.55);c*=1.-.12*exp(-x*x);
c=mix(c,I[2],pow(1.-n.z,2.6)*.85);c+=1.1*l(r,vec3(-.32,-.42,.85),110.)+.18*l(r,vec3(-.32,-.42,.85),10.)+.45*l(r,vec3(.75,-.1,.5),40.)+.5*l(r,vec3(.1,-.75,.6),70.);
o=vec4(min(c,vec3(1))*a,a);}`;

    // An emoji, or a flag: A is the height of its wave, and U how much of it is out of the
    // pole, so it never squeezes. E is where the pole is, and nothing shows behind it. Nothing is drawn past the sprite's own edges, so its last
    // row of pixels can't smear below it.
    const clothShader = `#version 300 es
precision highp float;
uniform sampler2D T;uniform float U,A,W,E;in vec2 v;out vec4 o;
void main(){float x=v.x+1.-U,s=v.x*7.-W,e=pow(max(v.x,0.),1.2),y=(v.y-.5)*1.3+.5+A*e*sin(s);vec4 c=texture(T,vec2(x,y));
c.rgb*=1.+A*2.4*e*cos(s);o=c*step(0.,y)*step(y,1.)*step(x,1.)*step(E,v.x);}`;

    function program(fragment) {
      const p = gl.createProgram();
      [[gl.VERTEX_SHADER, quad], [gl.FRAGMENT_SHADER, fragment]].forEach(([type, src]) => {
        const s = gl.createShader(type);
        gl.shaderSource(s, src);
        gl.compileShader(s);
        gl.attachShader(p, s);
      });
      gl.bindAttribLocation(p, 0, 'p');
      gl.linkProgram(p);
      const u = { p };
      for (const n of 'QSRPLIUAWE') u[n] = gl.getUniformLocation(p, n);
      return u;
    }

    function texture(upload) {
      const t = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, t);
      upload();
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      return t;
    }

    // The letter comes from the page's own font. A wide blur of it gives a smooth dome over
    // every stroke, and its edge where the blur crosses half: a rounded tube of the letter,
    // with nothing to crease. Stored as outline and slope.
    function inflate(letter) {
      const N = 256, c = document.createElement('canvas');
      c.width = c.height = N;
      const x = c.getContext('2d', { willReadFrequently: true });
      x.font = `800 ${N / 1.25}px Archivo`;
      x.fillText(letter, 51, 205);                  // whole cells: canvases round text to them
      const a = x.getImageData(0, 0, N, N).data, sharp = new Float32Array(N * N);
      for (let i = 0; i < N * N; i++) sharp[i] = a[i * 4 + 3] / 255;
      const pass = (from, r, step) => {
        const to = new Float32Array(N * N);
        for (let i = 0; i < N * N; i++) {
          let s = 0;
          for (let k = -r; k <= r; k++) s += from[i + k * step] || 0;
          to[i] = s / (2 * r + 1);
        }
        return to;
      };
      const blur = (from, r) => pass(pass(from, r, 1), r, N);
      const tube = blur(blur(blur(sharp, 5), 5), 5);
      const z = blur(tube.map((q) => Math.sqrt(Math.max(0, (q - .5) * 2))), 1), field = new Float32Array(N * N * 4);
      for (let i = N; i < N * N - N; i++) {
        field.set([tube[i], 0, (z[i - 1] - z[i + 1]) * 10, (z[i - N] - z[i + N]) * 10], i * 4);
      }
      return texture(() => {
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, N, N, 0, gl.RGBA, gl.FLOAT, field);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      });
    }

    // A mark becomes a texture cropped to its ink, so it's the same size and in the
    // same place whichever system drew it, Apple's or anyone's. The poses of a strip keep
    // their whole cells, so the animal doesn't jump between them. Windows has no flags and
    // draws letters instead: those have no colour, so the flag is drawn from its rectangles.
    function sprite(art, rects, whole) {
      const S = art.width || 192, T = art.height || 192, c = document.createElement('canvas');
      c.width = S; c.height = T;
      const x = c.getContext('2d', { willReadFrequently: true });
      if (art.width) x.drawImage(art, 0, 0);
      else {
        x.font = `160px 'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif`;
        x.textAlign = 'center';
        x.fillText(art, S / 2, 150);
      }
      const { data } = x.getImageData(0, 0, S, T);
      let left = S, right = 0, top = T, bottom = 0, colour = 0;
      for (let i = 0; i < S * T; i++) {
        if (data[i * 4 + 3] < 16) continue;
        const px = i % S, py = i / S | 0;
        left = Math.min(left, px); right = Math.max(right, px);
        top = Math.min(top, py); bottom = Math.max(bottom, py);
        colour = Math.max(colour, Math.abs(data[i * 4] - data[i * 4 + 2]));
      }
      if (whole) { left = top = 0; right = S - 1; bottom = T - 1; }
      let w = right - left + 1, h = bottom - top + 1;
      const m = 12, crop = document.createElement('canvas'), y = crop.getContext('2d');
      if (rects && colour < 32) {
        w = 50 * rects[0][2]; h = 50 * rects[0][3];
        crop.width = w + 2 * m; crop.height = h + 2 * m;
        for (const [rx, ry, rw, rh, fill] of rects) {
          y.fillStyle = fill;
          y.fillRect(m + rx * 50, m + ry * 50, rw * 50, rh * 50);
        }
      } else {
        crop.width = w + 2 * m; crop.height = h + 2 * m;
        y.drawImage(c, left, top, w, h, m, m, w, h);
      }
      return {
        aspect: crop.width / crop.height,
        inset: m / crop.width,
        foot: m / crop.height,
        tex: texture(() => {
          gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
          gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, crop);
          gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
          gl.generateMipmap(gl.TEXTURE_2D);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
        }),
      };
    }

    const stage = document.createElement('canvas');
    let building = null;

    // A lost stage leaves plain letters, and comes back when the browser restores it.
    stage.addEventListener('webglcontextlost', (e) => { e.preventDefault(); gl = null; stage.hidden = true; });
    stage.addEventListener('webglcontextrestored', () => { building = null; });

    // The stage is built in small steps with a breath between them, so that a visitor's
    // first taps are never kept waiting for it.
    const breath = () => new Promise((go) => { setTimeout(go); });

    // A mark is an emoji, or a picture to decode first, with a plain dog if the browser can't.
    async function art(mark) {
      if (mark.length < 3) return mark;
      const picture = new Image();
      picture.src = mark;
      return picture.decode().then(() => picture, () => '🐕');
    }

    async function setUp() {
      gl = stage.getContext('webgl2', { antialias: false, powerPreference: 'low-power' });
      if (!gl) return;
      await breath();
      liquid = program(liquidShader);
      cloth = program(clothShader);
      gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0, 0, 1, 0, 0, 1, 1, 1]), gl.STATIC_DRAW);
      gl.enableVertexAttribArray(0);
      gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
      for (const g of greetings) {
        await breath();
        g.letter = inflate(g.word[0]);
        await breath();
        const look = await art(g.mark);
        g.emoji = look.width && g.poses ? Array.from({ length: g.poses }, (_, k) => {
          const cell = document.createElement('canvas'), w = look.width / g.poses;
          cell.width = w; cell.height = look.height;
          cell.getContext('2d').drawImage(look, k * w, 0, w, look.height, 0, 0, w, look.height);
          return sprite(cell, null, true);
        }) : [sprite(look)];
        g.banner = sprite(g.flag, g.rects);
      }
      stage.hidden = true;
      stage.setAttribute('aria-hidden', 'true');
      heading.append(stage);
    }

    // If anything fails on the way, there's no stage and the letters still change.
    const ready = () => (building ??= setUp().catch(() => { gl = null; }));

    function put(shader, tex, x, y, w, h) {
      gl.useProgram(shader.p);
      gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.uniform2f(shader.S, stage.width, stage.height);
      gl.uniform4f(shader.Q, x, y, w, h);
    }

    // The centre of each letter of a word at rest, kerning included, in em.
    function spacing({ word: text, nudge }) {
      const m = document.createElement('span');
      m.className = 'word';
      m.style.cssText = 'position:absolute;visibility:hidden';
      m.innerHTML = [...text].map((c) => `<span>${c}</span>`).join('');
      heading.append(m);
      const box = m.getBoundingClientRect(), em = parseFloat(getComputedStyle(m).fontSize);
      const rects = [...m.children].map((c) => c.getBoundingClientRect());
      m.remove();
      return {
        x: rects.map((r, n) => (r.left + r.width / 2 - box.left) / em + nudge[n]),
        cells: rects.map((r) => r.width / em),
        width: box.width / em + Math.max(...nudge),
      };
    }

    // ---------- the greeting ----------
    let current = 0, slots = null;

    // Lengths on the word's own size, whatever size the slot's glyph is set in.
    const at = (ems) => `calc(var(--hello) * ${ems})`;

    // The first change replaces the plain text with four slots, and they stay.
    function letters({ word: text }) {
      word.textContent = '';
      word.className = 'word live';
      return [...text].map((c) => {
        const el = word.appendChild(document.createElement('span'));
        el.textContent = c;
        return el;
      });
    }

    // How each glyph sits by its ink, not its advance, in em: its ink's width, how far to move
    // it so its ink is centred, and where its ink starts. The ink is found by drawing the glyph
    // and looking, because a font's own bounds are looser than what it draws, and unevenly so.
    // It's in em, so each glyph is measured once and kept.
    const pen = document.createElement('canvas'), ctx = pen.getContext('2d', { willReadFrequently: true });
    const inks = new Map();
    pen.width = 400; pen.height = 260;
    function measure(list) {
      if (list.every(([glyph, faces]) => inks.has(glyph + faces))) return list.map(([glyph, faces]) => inks.get(glyph + faces));
      const m = document.createElement('span');
      m.className = 'word';
      m.style.cssText = 'position:absolute;visibility:hidden';
      m.innerHTML = list.map(([glyph, faces]) => `<span class="${faces}">${glyph}</span>`).join('');
      heading.append(m);
      const em = parseFloat(getComputedStyle(m).fontSize);
      const sizes = [...m.children].map((c, n) => {
        const f = getComputedStyle(c), k = 160 / parseFloat(f.fontSize), glyph = list[n][0];
        ctx.clearRect(0, 0, 400, 260);
        ctx.font = `${f.fontStyle} ${f.fontWeight} 160px ${f.fontFamily}`;
        ctx.fillText(glyph, 100, 200);
        const data = ctx.getImageData(0, 0, 400, 260).data;
        let first = 400, end = 100;
        for (let p = 3; p < data.length; p += 4) {
          if (data[p] < 96) continue;
          const x = (p >> 2) % 400;
          if (x < first) first = x;
          if (x >= end) end = x + 1;
        }
        const left = (100 - first) / k, right = (end - 100) / k;
        const box = ctx.measureText(glyph).width / k + (parseFloat(f.letterSpacing) || 0);   // the box the slot centres
        const size = [(left + right) / em, (box / 2 - (right - left) / 2) / em, -left / em];
        inks.set(glyph + list[n][1], size);
        return size;
      });
      m.remove();
      return sizes;
    }

    async function play(i) {
      await ready();
      const g = greetings[i], from = spacing(greetings[current]), to = spacing(g);
      const width = Math.max(from.width, to.width);
      slots ??= letters(greetings[current]);
      word.style.cssText = `width:${width}em;height:1em`;

      // The stage covers the word and the room above it for the flag. The pole takes the
      // room there is, up to .42em and allowing for its overshoot, so the flag never reaches
      // the top of the window. On a window too short for a flag, there's no flag.
      const em = parseFloat(getComputedStyle(word).fontSize), D = Math.min(devicePixelRatio, 3);
      const side = .4, above = .5, px = em * D, base = (above + .8) * px;
      const room = heading.getBoundingClientRect().top / em + .8 - 20 / em;
      const rise = Math.min(.42, (room - .724) / 1.135), flagged = gl && rise > .2;
      const fh = Math.min(g.fly, rise - .06) * px;
      if (gl) {
        const W = Math.ceil((width + 2 * side) * px), H = Math.ceil(1.34 * px);
        if (stage.width !== W || stage.height !== H) { stage.width = W; stage.height = H; gl.viewport(0, 0, W, H); }
        stage.style.cssText = `left:${-side}em;top:${-above}em;width:${W / px}em;height:${H / px}em`;
        stage.hidden = false;
      }

      // Each glyph on the way is sized to fill the letter it stands in for, within reason, and
      // set by its ink. The first stands flush on the margin, the last against the l, and the
      // second between them, with the space either side shared in the finished word's own
      // proportion. The margin and the l never move, so every state keeps the word's spacing.
      // A letter that isn't changing stays exactly where it is, and until the first letter cuts,
      // the l and the new glyphs keep the last word's spacing around it, so nothing jumps open;
      // they move to the new word's places on that cut. A note's glyph is set at its size as
      // it cuts, and shrunk if it would crowd its neighbours.
      g.plays = (g.plays ?? -1) + 1;
      const notes = score(g, g.steps[g.plays % 2]), was = greetings[current];
      const marks = measure([...notes.map(([, , glyph, faces]) => [glyph, faces]), ...[...g.word, ...was.word].map((c) => [c, ''])]);
      const ends = marks.slice(-8, -4), olds = marks.slice(-4);
      const ink = (n) => to.x[n] - to.cells[n] / 2 + ends[n][2];
      const gap = [ink(1) - ink(0) - ends[0][0], ink(2) - ink(1) - ends[1][0]];
      const fit = notes.map(([, n, , faces], k) => (faces && n !== 2 ? clamp((ends[n][0] / marks[k][0] - .9) / .3) * .3 + .9 : 1));
      const beast = gl ? g.size * g.emoji[0].aspect * (1 - 2 * g.emoji[0].inset) + .18 : 0;
      const shape = [
        ...notes.map(([at, n, , faces], k) => (faces ? [at, n, marks[k][0] * fit[k], marks[k][1] * fit[k], null] : [at, n, ends[n][0], 0, to.x[n]])),
        [enter, 3, beast, 0, to.x[3] - to.cells[3] / 2 + beast / 2], [coat[0], 0, ends[0][0], 0, to.x[0]],
      ].sort((a, b) => a[0] - b[0]);
      const state = from.x.map((x, n) => [olds[n][0], 0, x]), shown = from.x.slice();
      let old0 = true;                                // slot 0 still shows the last word's letter
      const right0 = () => {
        const [w, , fixed] = state[0];
        if (fixed === null) return ink(0) + w;
        return old0 ? from.x[0] - from.cells[0] / 2 + olds[0][2] + olds[0][0] : ink(0) + ends[0][0];
      };
      const shift = () => (old0 ? from.x[2] - to.x[2] : 0);
      const where = (n) => {
        const [w, , fixed] = state[n];
        if (n === 0) return fixed !== null ? fixed : ink(0) + w / 2;
        if (n === 2) return to.x[2] + shift();
        if (n === 1 && fixed === null) {
          const room = ink(2) + shift() - right0() - w;
          return right0() + room * gap[0] / (gap[0] + gap[1]) + w / 2;
        }
        return (fixed !== null ? fixed : ink(n) + w / 2) + (n === 3 ? shift() : 0);
      };
      // How much a glyph in the second slot shrinks so it keeps at least the word's own gaps.
      const squeeze = () => {
        const [w, , fixed] = state[1];
        if (fixed !== null) return 1;
        return Math.max(.8, Math.min(1, (ink(2) + shift() - right0() - gap[0] - gap[1]) / w));
      };
      const sizes = fit.slice();
      const hit = [-99, -99, -99, -99], hue = hex(g.paint[g.plays % 2]), start = performance.now();
      const last = lower[1] + 4, fling = Math.max(0, Math.min(.5, room - g.size - .06));
      const tick = (now) => {
        const t = (now - start) * .06;
        while (notes.length && notes[0][0] <= t) {
          const [beat, n, glyph, faces] = notes.shift(), k = sizes.shift();
          const face = faces.split(' '), em0 = (face.includes('i') ? .94 : face.includes('m') ? .9 : 1) * k;
          slots[n].textContent = glyph;
          slots[n].className = faces;
          slots[n].style.fontSize = k !== 1 ? `${em0}em` : '';
          slots[n].style.top = k !== 1 ? `${(.8 * (1 - em0)) / em0}em` : '';
          if (n || faces) hit[n] = beat;              // the ink letter takes the lacquer's place exactly
        }

        // Every cut lands whole: its glyph and the spacing around it change on the same frame. The
        // l stays where it is and stretches from the baseline. A glyph that pops in grows from
        // the baseline, and the first letter from the margin, so the left edge never moves. The
        // word comes to rest exactly where plain text would set it.
        while (shape.length && shape[0][0] <= t) { const [, n, w, move, fixed] = shape.shift(); state[n] = [w, move, fixed]; if (!n) old0 = false; }
        const xs = [where(0), where(1), where(2), where(3)];
        xs.forEach((x, n) => { shown[n] = t < last ? x : to.x[n]; });
        const pole = t < last ? spring(span(t, raise)) * (1 - drop(span(t, lower))) : 0;
        slots.forEach((el, n) => {
          // The landing letter pops; the second letter barely; the first, on the margin, not at all.
          const size = n === 0 ? 1 : pop(t - hit[n], n === 1 ? .05 : .1);
          el.style.transform = `translateX(${at(n === 2 ? xs[2] : shown[n] + state[n][1])}) ${n === 2 ? `scaleY(${1 + pole * rise / .724})` : `scale(${size * (n === 1 ? squeeze() : 1)})`}`;
        });

        // What's on the stage takes its slot's place, for as long as there's a stage.
        slots[0].style.visibility = gl && t >= coat[0] && t < coat[1] ? 'hidden' : '';
        slots[3].style.visibility = gl && t >= enter && t < launch[1] - 1 ? 'hidden' : '';

        if (gl) {
          gl.clearColor(0, 0, 0, 0);
          gl.clear(gl.COLOR_BUFFER_BIT);

          // The first letter is poured in lacquer of its colour, inflates, and cuts to ink.
          if (t >= coat[0] && t < coat[1]) {
            const k = 1.25 * px, mid = .1992 * 1.25 + to.cells[0] / 2;
            put(liquid, g.letter, (shown[0] + side) * px - k * mid / 1.25, base - k * .8008, k, k);
            gl.uniform1f(liquid.P, mix(.5, 1, spring(span(t, [coat[0], coat[0] + 12]))));
            gl.uniform2f(liquid.L, mix(.22, -.3, smooth(span(t, coat))), mix(.12, -.06, smooth(span(t, coat))));
            gl.uniform3fv(liquid.I, [...hue.map((c) => c * .5), ...hue, ...hue.map((c) => mix(c, 1, .5))]);
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
          }

          // The animal lands hard in the last slot, with clear air either side, facing the l, and
          // hops once while the light crosses the lacquer. It gathers itself, and the l flings it
          // up and away with a spin. It keeps rising, drops to half its size over its last
          // frames, and is cut there as the last letter lands, so they share a frame at any rate.
          if (t >= enter && t < launch[1]) {
            let pose = 0;
            for (const [f, k] of g.act ?? []) if (t >= f) pose = k;
            const look = g.emoji[pose] ?? g.emoji[0];
            const go = span(t, launch), squash = 1 - .1 * bump(t - launch[0] + 3, 3);
            const h = g.size * px * slam(t - enter) * (1 + .03 * Math.sin(t * .4)) * (1 - .5 * smooth(span(go, [.5, 1])));
            const w = h * look.aspect * (2 - squash), tall = h * squash;
            const centre = base - (.07 * bump(t - perk[0], perk[1] - perk[0]) + fling * out(go) + .18 * go * go + g.size * .5) * px;
            put(cloth, look.tex, (shown[3] + .32 * go + .22 * go * go + side) * px - w / 2, centre - tall * .65, w, tall * 1.3);
            gl.uniform1f(cloth.R, .45 * go);
            gl.uniform1f(cloth.U, 1);
            gl.uniform1f(cloth.A, 0);
            gl.uniform1f(cloth.W, 0);
            gl.uniform1f(cloth.E, 0);
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
          }

          // The flag eases out of the pole and rides it, flutters, snaps once, and goes back in.
          const u = smooth(span(t, open)) * (1 - smooth(span(t, close)));
          if (flagged && u > 0) {
            const hoist = (xs[2] + .1045 + side) * px, top = base - (.724 + rise * pole) * px;
            const w = fh * Math.min(1.5, g.banner.aspect);
            put(cloth, g.banner.tex, hoist - w * g.banner.inset, top - fh * .15, w, fh * 1.3);
            gl.uniform1f(cloth.R, 0);
            gl.uniform1f(cloth.U, u);
            gl.uniform1f(cloth.A, .065 + .08 * (1 - span(t, [open[0], open[1] + 10])) + .2 * bump(t - gust[0], gust[1] - gust[0]));
            gl.uniform1f(cloth.W, t * .24);
            gl.uniform1f(cloth.E, g.banner.inset);
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
          }
        }

        if (t < last) requestAnimationFrame(tick);
        else {
          stage.hidden = true;
          current = i;
        }
      };
      tick(start);
    }

    let timer = null;
    function start() {
      if (timer || reduce.matches || document.hidden) return;
      timer = setInterval(() => play((current + 1) % greetings.length), every);
    }
    function stop() { clearInterval(timer); timer = null; }

    // Only a real mouse pauses it: on touch, hover sticks and nothing would resume it.
    heading.addEventListener('pointerenter', (e) => { if (e.pointerType === 'mouse') stop(); });
    heading.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse') start(); });
    document.addEventListener('visibilitychange', () => (document.hidden ? stop() : start()));
    reduce.addEventListener('change', () => (reduce.matches ? stop() : start()));

    if (reduce.matches || document.hidden) return start();
    pageReady.then(ready).then(() => {
      setTimeout(() => { play(0); start(); }, 700);
    });
  })();
</script>
</body>
</html>
