<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>José Manosalvas</title>
<meta name="description" content="Hola, I’m José. Say hello at hello@josemanosalvas.ch.">
<meta property="og:title" content="José Manosalvas">
<meta property="og:description" content="Say hello at hello@josemanosalvas.ch.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23F5F3EC'/%3E%3Cpath d='M6 22h20' stroke='%23191813' stroke-width='4'/%3E%3C/svg%3E">
<style>
  /* Everything this page needs, and nothing else. Faces and colours are
     Mitad's; the fonts are subset to the characters on the page and
     embedded by tools/build.py, which also minifies this file into
     ../index.html, the one that gets uploaded.
     Archivo, Literata and B612 Mono: SIL Open Font License 1.1, see OFL.txt. */

  /* fonts:start */
  /* fonts:end */

  :root {
    --bg: #F5F3EC;            /* Mitad Papel */
    --ink: #191813;           /* Mitad Tinta */
    --focus: #0C4CA8;         /* Mitad Azul */
    --aji: #D91E36;           /* accents appear only while the word changes */
    --sans: 'Archivo', 'Helvetica Neue', 'Arial', sans-serif;
    --serif: 'Literata', 'Georgia', serif;
    --mono: 'B612 Mono', 'Courier New', monospace;
    --gutter: clamp(1.5rem, 5vw, 4.5rem);
    --hello: min(33vw, 40svh, 20rem);   /* the widest state must fit */
    color-scheme: light;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161511;
      --ink: #EBE7DC;
      --focus: #56B8DF;       /* Mitad Guayas */
      --aji: #F0596B;
      color-scheme: dark;
    }
  }

  *, ::before, ::after { box-sizing: border-box; }
  * { margin: 0; }

  html {
    height: 100%;
    background: var(--bg);
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
    font-synthesis: none;
  }

  body {
    display: grid;
    grid-template-columns: minmax(0, 1fr);   /* a wide glyph can't stretch the page */
    grid-template-rows: minmax(min-content, 1fr) minmax(min-content, 1fr);
    height: 100%;
    min-height: 100svh;
    font: 1.125rem/1.5rem var(--sans);
    font-kerning: normal;
    color: var(--ink);
    background: var(--bg);
  }

  .fonts-pending body { visibility: hidden; }

  ::selection { background: #F2B705; color: #191813; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  /* ---------- above the horizon ---------- */
  .north {
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: var(--gutter) var(--gutter) 0;
    padding-top: max(var(--gutter), env(safe-area-inset-top));
    overflow-x: clip;
  }

  /* The word's baseline is the horizon and anything below it is cut, so
     nothing in the word or on the stage ever touches the name. */
  h1 {
    position: relative;
    font-size: var(--hello);
    line-height: 1;
    letter-spacing: -0.045em;
    margin-left: -0.06em;            /* optical: pull the stem to the margin */
    height: 0.8em;                   /* ascent only: baseline = bottom edge */
    clip-path: inset(-1em -1em -0.025em -1em);   /* keep round overshoot whole */
    white-space: nowrap;
  }

  .word {
    display: inline-block;
    position: relative;
    font-weight: 800;
  }

  /* After the first change, each letter is a slot on its own layer and stays one, so
     nothing is re-rasterised when a word comes to rest. Slots are placed by transforms,
     so nothing reflows and the title can't grow. The l also grows into the flagpole: it's
     a plain rectangle, so stretching it from the baseline has no seam. */
  .word.live > span {
    position: absolute;
    left: 0;
    top: 0;
    display: flex;
    transform-origin: 0 80%;
    will-change: transform;
  }

  /* The symbol is as tall as the l, its foot on the horizon. */
  .word.live > .cut { top: .02em; font-size: .92em; }
  .cut, .c { justify-content: center; }
  .r { color: var(--aji); }
  .b { color: var(--focus); }

  /* The stage carries what type can't: the inflated letter, the emoji and the flag. */
  canvas {
    position: absolute;
    pointer-events: none;
  }

  /* ---------- below the horizon ---------- */
  .south {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 1.5rem var(--gutter) var(--gutter);
    padding-bottom: max(var(--gutter), env(safe-area-inset-bottom));
  }

  .name {
    margin-bottom: 0.75rem;
    font-weight: 300;
    font-size: clamp(2rem, min(7vw, 11svh), 4.5rem);
    line-height: 1.1;
    letter-spacing: -0.02em;
  }

  a {
    color: inherit;
    text-decoration-thickness: 1px;
    text-underline-offset: 0.18em;
  }

  a:hover { text-decoration-thickness: 2px; }


  .hello {
    font-family: var(--serif);
    font-style: italic;
    font-size: clamp(1.25rem, 3vw, 1.75rem);
    line-height: 1.3;
    overflow-wrap: anywhere;
  }

  .elsewhere { text-align: right; }

  .elsewhere a {
    font: 0.75rem/1.5rem var(--mono);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }

</style>
<script>
  /* Start decoding all three fonts now and reveal the page in one frame when
     they are ready, so nothing paints in pieces (under font-display: block,
     text waits for its own font but underlines don't, and faces finish at
     different times). Without JS nothing is hidden; after 3s it shows anyway. */
  (() => {
    const root = document.documentElement;
    root.classList.add('fonts-pending');
    window.pageReady = new Promise((ready) => {
      const show = () => { root.classList.remove('fonts-pending'); ready(); };
      Promise.all(['800 1em Archivo', 'italic 1em Literata', '1em "B612 Mono"'].map((f) => document.fonts.load(f)))
        .finally(show);
      setTimeout(show, 3000);
    });
  })();
</script>
</head>
<body>
  <header class="north">
    <h1><span class="word" aria-hidden="true">Hola</span><span class="visually-hidden"><span lang="es">Hola</span>, I’m José.</span></h1>
  </header>

  <main class="south">
    <div>
      <p class="name" aria-hidden="true">I’m José.</p>
      <p class="hello"><a href="mailto:hello@josemanosalvas.ch">hello@josemanosalvas.ch</a></p>
    </div>
    <p class="elsewhere"><a href="https://github.com/josemanosalvas">GitHub</a></p>
  </main>

<script>
  (() => {
    // Each greeting: its word, what its last letter passes through and how tall that is
    // in em, its flag, and its symbol's colour, from the flag. Hola's mark is an emoji.
    // Salü's is the white Swiss shepherd, which no system has: a small render, modelled
    // in tools/shepherd.html. Nudges are optical, in em: the S starts where the H does,
    // and a and l sit further apart. The rectangles are the flag for systems that have
    // no flag emoji, on a 3 x 2 grid.
    const greetings = [
      {
        word: 'Hola', mark: '✨', size: .5, flag: '🇪🇨', symbol: 'b', nudge: [0, 0, 0, 0],
        rects: [[0, 0, 3, 1, '#FFDD00'], [0, 1, 3, .5, '#034EA2'], [0, 1.5, 3, .5, '#D91E36']],
      },
      {
        word: 'Salü', mark: 'shepherd.avif', size: .66, flag: '🇨🇭', symbol: 'r', nudge: [.024, .024, .036, .03],
        rects: [[0, 0, 3, 2, '#D91E36'], [1.25, .4, .5, 1.2, '#FFF'], [.9, .75, 1.2, .5, '#FFF']],
      },
    ];

    // One score for every change, in ms from its start. The l never changes: it's the
    // same letter in both words, so the word never leaves. Everything else cuts at once
    // and resolves within a second.
    const cutTo = ({ word: w, symbol }) => [
      [0, 1, '/', `cut ${symbol}`],
      [swap, 0, w[0], ''],
      [300, 1, w[1], 'c'],
      [520, 3, w[3], 'c'],
    ];
    const mark = [0, 520];                        // the emoji holds the last slot
    const swap = 133;                             // the first letter cuts, after all the others
    const swell = [swap, 650], set = [540, 680];  // it inflates, then sets into ink
    const grow = { 1: [300, 660], 3: [520, 820] };   // hairline to heavy
    const raise = [1040, 1320], open = [1300, 1700];  // the l grows into a pole, then the flag opens
    const close = [2460, 2680], lower = [2680, 2920]; // and back, in the other order
    const stretch = .38 / .724;                       // .38em, on Archivo 800's .724em l
    const every = 6500;

    const word = document.querySelector('.word');
    const heading = document.querySelector('h1');
    const reduce = matchMedia('(prefers-reduced-motion: reduce)');
    const clamp = (x) => (x < 0 ? 0 : x > 1 ? 1 : x);
    const span = (t, [a, b]) => clamp((t - a) / (b - a));
    const smooth = (x) => x * x * (3 - 2 * x);
    const soft = (x) => x * x * x * (x * (6 * x - 15) + 10);
    const spring = (x) => 1 - Math.exp(-7 * x) * Math.cos(11 * x);
    const mix = (a, b, x) => a + (b - a) * x;

    // ---------- the stage ----------
    // WebGL carries what type can't: the inflated letter, the emoji and the flag. It's
    // two small shaders and it's only used here, so without it the letters still change.
    let gl, metal, cloth;

    const quad = `#version 300 es
uniform vec4 Q;uniform vec2 S;uniform float R;in vec2 p;out vec2 v;
void main(){v=p;vec2 d=(p-.5)*Q.zw,c=Q.xy+Q.zw*.5;d=mat2(cos(R),sin(R),-sin(R),cos(R))*d;c=(c+d)/S*2.-1.;gl_Position=vec4(c.x,-c.y,0,1);}`;

    // Liquid silver: a soft room with a dark horizon, one big light and one strip. The
    // light is soft on purpose: hard edges in a reflection look like a 2000s bevel. P
    // inflates it, L tilts it so the light travels, M fades it from the page's ink, and V
    // dissolves it into the real letter. On paper its rim goes dark; on a dark page the rim
    // catches the light and the metal is brighter, so it's never dimmer than the type.
    const metalShader = `#version 300 es
precision highp float;
uniform sampler2D T;uniform float P,M,V;uniform vec2 L;uniform vec3 I;in vec2 v;out vec4 o;
float l(vec3 r,vec3 d,float s){return pow(max(dot(r,normalize(d)),0.),s);}
void main(){vec4 t=texture(T,v);float f=mix(t.r,t.g,min(P*2.,1.)),w=fwidth(f)*.75,a=smoothstep(.5-w,.5+w,f);
vec3 n=normalize(vec3((t.ba+L)*P,1.)),r=reflect(vec3(0,0,-1),n);float y=-r.y,x=(y+.12)/.2;
vec3 c=mix(vec3(.15,.16,.18),vec3(.5,.51,.53),smoothstep(-.9,.7,y));c*=1.-.6*exp(-x*x);
c+=.95*l(r,vec3(-.34,-.4,.85),24.)+.3*l(r,vec3(-.3,-.5,.8),5.)+.35*l(r,vec3(.8,-.12,.45),20.);
c*=mix(1.,I.r>.5?1.3:.5,smoothstep(.32,.68,1.-n.z));if(I.r>.5)c=c*1.15+.3;o=vec4(mix(I,c,M)*a,a)*V;}`;

    // An emoji, or a flag: U crops it from the hoist, A is the height of its wave.
    const clothShader = `#version 300 es
precision highp float;
uniform sampler2D T;uniform float U,A,W;in vec2 v;out vec4 o;
void main(){float x=v.x,s=x*7.-W,e=pow(max(x,0.),1.2);vec4 c=texture(T,vec2(x,(v.y-.5)*1.3+.5+A*e*sin(s)));
c.rgb*=1.+A*2.4*e*cos(s);float f=max(.07*(1.-U),.002);x-=.03*sin(v.y*8.+W)*(1.-min(U,1.));o=c*(1.-smoothstep(U-f,U,x));}`;

    function program(fragment) {
      const p = gl.createProgram();
      [[gl.VERTEX_SHADER, quad], [gl.FRAGMENT_SHADER, fragment]].forEach(([type, src]) => {
        const s = gl.createShader(type);
        gl.shaderSource(s, src);
        gl.compileShader(s);
        gl.attachShader(p, s);
      });
      gl.bindAttribLocation(p, 0, 'p');
      gl.linkProgram(p);
      const u = { p };
      for (const n of 'QSRPMVLIUAW') u[n] = gl.getUniformLocation(p, n);
      return u;
    }

    function texture(upload) {
      const t = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, t);
      upload();
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      return t;
    }

    // The letter comes from the page's own font. Its corners are eased with a blur,
    // then its surface is solved: laplacian(h) = -1 inside the outline and h = 0 on
    // it, which is the shape a balloon takes. Stored as outline, eased outline, slope.
    function inflate(letter) {
      const N = 256, c = document.createElement('canvas');
      c.width = c.height = N;
      const x = c.getContext('2d', { willReadFrequently: true });
      x.font = `800 ${N / 1.25}px Archivo`;
      x.fillText(letter, 51, 205);                  // whole cells: canvases round text to them
      const a = x.getImageData(0, 0, N, N).data, sharp = new Float32Array(N * N);
      for (let i = 0; i < N * N; i++) sharp[i] = a[i * 4 + 3] / 255;
      const pass = (from, r, step) => {
        const to = new Float32Array(N * N);
        for (let i = 0; i < N * N; i++) {
          let s = 0;
          for (let k = -r; k <= r; k++) s += from[i + k * step] || 0;
          to[i] = s / (2 * r + 1);
        }
        return to;
      };
      const blur = (from, r) => pass(pass(from, r, 1), r, N);
      const eased = blur(blur(blur(sharp, 3), 3), 3), soft = blur(sharp, 1);
      const inside = [], h = new Float32Array(N * N);
      for (let i = N; i < N * N - N; i++) if (eased[i] > .5) inside.push(i);
      for (let k = 0; k < 150; k++) {
        for (const i of inside) h[i] += 1.9 * ((h[i - 1] + h[i + 1] + h[i - N] + h[i + N] + 1) / 4 - h[i]);
      }
      const top = h.reduce((p, q) => (p > q ? p : q));
      const z = blur(blur(h.map((q) => Math.sqrt(Math.max(0, q / top))), 2), 2);
      const field = new Float32Array(N * N * 4);
      for (let i = N; i < N * N - N; i++) {
        field.set([soft[i], eased[i], (z[i - 1] - z[i + 1]) * 13, (z[i - N] - z[i + N]) * 13], i * 4);
      }
      return texture(() => {
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, N, N, 0, gl.RGBA, gl.FLOAT, field);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      });
    }

    // A mark becomes a texture cropped to its ink, so it's the same size and in the
    // same place whichever system drew it, Apple's or anyone's. Windows has no flags and
    // draws letters instead: those have no colour, so the flag is drawn from its rectangles.
    function sprite(art, rects) {
      const S = art.width || 192, T = art.height || 192, c = document.createElement('canvas');
      c.width = S; c.height = T;
      const x = c.getContext('2d', { willReadFrequently: true });
      if (art.width) x.drawImage(art, 0, 0);
      else {
        x.font = `160px 'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif`;
        x.textAlign = 'center';
        x.fillText(art, S / 2, 150);
      }
      const { data } = x.getImageData(0, 0, S, T);
      let left = S, right = 0, top = T, bottom = 0, colour = 0;
      for (let i = 0; i < S * T; i++) {
        if (data[i * 4 + 3] < 16) continue;
        const px = i % S, py = i / S | 0;
        left = Math.min(left, px); right = Math.max(right, px);
        top = Math.min(top, py); bottom = Math.max(bottom, py);
        colour = Math.max(colour, Math.abs(data[i * 4] - data[i * 4 + 2]));
      }
      let w = right - left + 1, h = bottom - top + 1;
      const m = 6, crop = document.createElement('canvas'), y = crop.getContext('2d');
      if (rects && colour < 32) {
        w = 150; h = 100;
        crop.width = w + 2 * m; crop.height = h + 2 * m;
        for (const [rx, ry, rw, rh, fill] of rects) {
          y.fillStyle = fill;
          y.fillRect(m + rx * 50, m + ry * 50, rw * 50, rh * 50);
        }
      } else {
        crop.width = w + 2 * m; crop.height = h + 2 * m;
        y.drawImage(c, left, top, w, h, m, m, w, h);
      }
      return {
        aspect: crop.width / crop.height,
        inset: m / crop.width,
        foot: m / crop.height,
        tex: texture(() => {
          gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
          gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, crop);
          gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
          gl.generateMipmap(gl.TEXTURE_2D);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
        }),
      };
    }

    const stage = document.createElement('canvas');
    let building = null;

    // A lost stage leaves plain letters, and comes back when the browser restores it.
    stage.addEventListener('webglcontextlost', (e) => { e.preventDefault(); gl = null; stage.hidden = true; });
    stage.addEventListener('webglcontextrestored', () => { building = null; });

    // The stage is built in small steps with a breath between them, so that a visitor's
    // first taps are never kept waiting for it.
    const breath = () => new Promise((go) => { setTimeout(go); });

    // A mark is an emoji, or a picture to decode first, with a plain dog if the browser can't.
    async function art(mark) {
      if (mark.length < 3) return mark;
      const picture = new Image();
      picture.src = mark;
      return picture.decode().then(() => picture, () => '🐕');
    }

    async function setUp() {
      gl = stage.getContext('webgl2', { antialias: false, powerPreference: 'low-power' });
      if (!gl) return;
      await breath();
      metal = program(metalShader);
      cloth = program(clothShader);
      gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0, 0, 1, 0, 0, 1, 1, 1]), gl.STATIC_DRAW);
      gl.enableVertexAttribArray(0);
      gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
      for (const g of greetings) {
        await breath();
        g.letter = inflate(g.word[0]);
        await breath();
        g.emoji = sprite(await art(g.mark));
        g.banner = sprite(g.flag, g.rects);
      }
      stage.hidden = true;
      stage.setAttribute('aria-hidden', 'true');
      heading.append(stage);
    }

    // If anything fails on the way, there's no stage and the letters still change.
    const ready = () => (building ??= setUp().catch(() => { gl = null; }));

    function put(shader, tex, x, y, w, h) {
      gl.useProgram(shader.p);
      gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.uniform2f(shader.S, stage.width, stage.height);
      gl.uniform4f(shader.Q, x, y, w, h);
    }

    // Where each letter of a word sits at rest, kerning included, in em.
    function spacing({ word: text, nudge }) {
      const m = document.createElement('span');
      m.className = 'word';
      m.style.cssText = 'position:absolute;visibility:hidden';
      m.innerHTML = [...text].map((c) => `<span>${c}</span>`).join('');
      heading.append(m);
      const box = m.getBoundingClientRect(), em = parseFloat(getComputedStyle(m).fontSize);
      const rects = [...m.children].map((c) => c.getBoundingClientRect());
      m.remove();
      return {
        x: rects.map((r, n) => (r.left - box.left) / em + nudge[n]),
        cells: rects.map((r) => r.width / em),
        width: box.width / em + Math.max(...nudge),
      };
    }

    // ---------- the greeting ----------
    let current = 0, slots = null;

    // Lengths on the word's own size, whatever size the slot's glyph is set in.
    const at = (ems) => `calc(var(--hello) * ${ems})`;

    // The first change replaces the plain text with four slots, and they stay.
    function letters({ word: text }) {
      word.textContent = '';
      word.className = 'word live';
      return [...text].map((c) => {
        const el = word.appendChild(document.createElement('span'));
        el.textContent = c;
        return el;
      });
    }

    async function play(i) {
      await ready();
      const g = greetings[i], from = spacing(greetings[current]), to = spacing(g);
      const width = Math.max(from.width, to.width);
      slots ??= letters(greetings[current]);
      word.style.cssText = `width:${width}em;height:1em`;
      slots.forEach((el, n) => { el.style.width = at(to.cells[n]); });

      // The stage covers the word and the room above it for the flag. There is always
      // that room: --hello is at most 40svh and the baseline stays around 50svh.
      const em = parseFloat(getComputedStyle(word).fontSize), D = Math.min(devicePixelRatio, 3);
      const side = .3, above = .5, px = em * D, base = (above + .8) * px;
      const ink = getComputedStyle(word).color.match(/[\d.]+/g).slice(0, 3).map((c) => c / 255);
      if (gl) {
        const W = Math.ceil((width + 2 * side) * px), H = Math.ceil(1.34 * px);
        if (stage.width !== W || stage.height !== H) { stage.width = W; stage.height = H; gl.viewport(0, 0, W, H); }
        stage.style.cssText = `left:${-side}em;top:${-above}em;width:${W / px}em;height:${H / px}em`;
        stage.hidden = false;
      }

      const cuts = cutTo(g), start = performance.now();
      const tick = (now) => {
        const t = now - start;
        while (cuts.length && cuts[0][0] <= t) {
          const [, n, glyph, styles] = cuts.shift();
          slots[n].textContent = glyph;
          slots[n].className = styles;
        }

        // Each slot goes to its place as it cuts. The l stretches into the pole from the baseline.
        const xs = to.x.map((x, n) => (n === 0 && t < swap ? from.x[0] : x));
        const pole = gl ? smooth(span(t, raise)) * (1 - smooth(span(t, lower))) : 0;
        slots.forEach((el, n) => {
          el.style.transform = `translateX(${at(xs[n])}) scaleY(${n === 2 ? 1 + pole * stretch : 1})`;
        });

        // New letters grow from hairline to heavy.
        for (const n in grow) {
          if (t < grow[n][0]) continue;
          const done = span(t, grow[n]);
          slots[n].style.fontWeight = done < 1 ? mix(100, 800, smooth(done)) : '';
          if (done === 1) slots[n].className = '';
        }

        // What's on the stage takes its slot's place, for as long as there's a stage.
        const live = gl && t >= swell[0] && t < set[1], held = gl && t >= mark[0] && t < mark[1];
        slots[0].style.visibility = live && t < set[1] - 80 ? 'hidden' : '';
        slots[3].style.visibility = held ? 'hidden' : '';

        if (gl) {
          gl.clearColor(0, 0, 0, 0);
          gl.clear(gl.COLOR_BUFFER_BIT);

          // The first letter inflates in silver, the light crosses it, and it sets into ink.
          if (live) {
            const size = 1.25 * px, cross = smooth(span(t, [swell[0], set[1]])), flat = smooth(span(t, set));
            put(metal, g.letter, (xs[0] + side) * px - size * 51 / 256, base - size * 205 / 256, size, size);
            gl.uniform1f(metal.P, spring(span(t, swell)) * (1 - flat));
            gl.uniform1f(metal.M, smooth(span(t, [swell[0], swell[0] + 50])) * (1 - flat));
            gl.uniform2f(metal.L, mix(.22, -.3, cross), mix(.12, -.06, cross));
            gl.uniform1f(metal.V, 1 - smooth(span(t, [set[1] - 80, set[1]])));
            gl.uniform3fv(metal.I, ink);
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
          }

          // The emoji cuts in, stands on the horizon in the last slot, and cuts out.
          if (held) {
            const h = g.size * px, w = h * g.emoji.aspect;
            put(cloth, g.emoji.tex, (xs[3] + side + .34) * px - w / 2, base - h * (1.15 - g.emoji.foot), w, h * 1.3);
            gl.uniform1f(cloth.R, 0);
            gl.uniform1f(cloth.U, 2);
            gl.uniform1f(cloth.A, 0);
            gl.uniform1f(cloth.W, 0);
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
          }

          // The flag opens from the pole, hoist flush against it.
          const u = soft(span(t, open)) * (1 - smooth(span(t, close)));
          if (u > 0) {
            const h = .3 * px, w = h * Math.min(1.5, g.banner.aspect);
            put(cloth, g.banner.tex, (xs[2] + .2261 + side) * px - w * g.banner.inset, base - 1.104 * px - h * .15, w, h * 1.3);
            gl.uniform1f(cloth.R, 0);
            gl.uniform1f(cloth.U, u);
            gl.uniform1f(cloth.A, .03 + .03 * (1 - u));
            gl.uniform1f(cloth.W, t * .0065);
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
          }
        }

        if (t < lower[1]) requestAnimationFrame(tick);
        else {
          stage.hidden = true;
          current = i;
        }
      };
      tick(start);
    }

    let timer = null;
    function start() {
      if (timer || reduce.matches || document.hidden) return;
      timer = setInterval(() => play((current + 1) % greetings.length), every);
    }
    function stop() { clearInterval(timer); timer = null; }

    // Only a real mouse pauses it: on touch, hover sticks and nothing would resume it.
    heading.addEventListener('pointerenter', (e) => { if (e.pointerType === 'mouse') stop(); });
    heading.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse') start(); });
    document.addEventListener('visibilitychange', () => (document.hidden ? stop() : start()));
    reduce.addEventListener('change', () => (reduce.matches ? stop() : start()));

    if (reduce.matches || document.hidden) return start();
    pageReady.then(ready).then(() => {
      setTimeout(() => { play(0); start(); }, 700);
    });
  })();
</script>
</body>
</html>
