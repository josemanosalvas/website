<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>José Manosalvas</title>
<meta name="description" content="Hola, I’m José. Say hello at hello@josemanosalvas.ch.">
<meta property="og:title" content="José Manosalvas">
<meta property="og:description" content="Say hello at hello@josemanosalvas.ch.">
<meta property="og:url" content="https://josemanosalvas.ch/">
<meta property="og:type" content="website">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script>
  (() => {
    try {
      const m = localStorage.getItem('mitad-mode');
      if (m === 'light' || m === 'dark') document.documentElement.dataset.mode = m;
    } catch (e) { /* storage blocked: follow the OS */ }
  })();
</script>
<link rel="stylesheet" href="css/mitad.css">
<style>
  /* The page is the equator: paper above latitude 0°00′00″, the flag below.
     Mitad supplies the voices and the colours; this sheet is a poster. */

  :root {
    --gutter: clamp(1.5rem, 5vw, 4.5rem);
    --hello: min(33vw, 40svh, 20rem);   /* "Salut" must fit the width */
    --band: clamp(0.75rem, 1.6svh, 1.25rem);
  }

  html, body { height: 100%; }

  body {
    display: grid;
    grid-template-rows: minmax(16rem, 1fr) minmax(16rem, 1fr);
    min-height: 100svh;
  }

  /* ---------- north: paper ---------- */
  .north {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: var(--gutter) var(--gutter) 0;
    padding-top: max(var(--gutter), env(safe-area-inset-top));
  }

  .languages {
    display: flex;
    flex-wrap: wrap;
    gap: 0 var(--s-6);
    margin: 0;
  }

  .languages button {
    background: none;
    border: 0;
    padding: 0;
    cursor: pointer;
    transition: color 200ms;
  }

  @media (prefers-reduced-motion: reduce) {
    .languages button { transition: none; }
  }

  .languages button:hover { color: var(--c-ink); }
  .languages button[aria-pressed="true"] { color: var(--c-accent); }

  .languages small {
    font-size: inherit;
    opacity: 0.6;
  }

  /* The horizon. The word's baseline sits on the band and anything below
     the line is cut off, so greetings rise out of it and set back into it. */
  h1 {
    margin: 0;
    font-family: var(--f-sans);
    font-size: var(--hello);
    line-height: 1;
    letter-spacing: -0.045em;
    margin-left: -0.06em;            /* optical: pull the stem to the margin */
    height: 0.8em;                   /* ascent only: baseline = bottom edge */
    clip-path: inset(-1em -1em 0 -1em);
    white-space: nowrap;
  }

  .word {
    display: inline-block;
    font-weight: 800;
  }

  .word.set  { animation: set 520ms cubic-bezier(.55, 0, .8, .2) forwards; }
  .word.rise { animation: rise 900ms cubic-bezier(.16, .84, .24, 1) both; }

  @keyframes set {
    to { transform: translateY(105%); font-weight: 300; }
  }
  @keyframes rise {
    from { transform: translateY(105%); font-weight: 200; }
    55%  { font-weight: 500; }
    to   { transform: translateY(0); font-weight: 800; }
  }

  /* ---------- south: the flag ---------- */
  .south {
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    background: var(--c-accent);
    color: var(--c-bg);
    border-top: var(--band) solid #F2B705;          /* Sol */
    border-bottom: calc(var(--band) / 2) solid #D91E36;  /* Ají */
    padding: var(--s-6) var(--gutter) var(--gutter);
    padding-bottom: max(var(--gutter), env(safe-area-inset-bottom));
  }

  .name {
    margin: 0 0 var(--s-3);
    font-family: var(--f-sans);
    font-weight: 300;
    font-size: clamp(2rem, 7vw, 4.5rem);
    line-height: 1.1;
    letter-spacing: -0.02em;
  }

  .south a {
    color: inherit;
    text-decoration-thickness: 1px;
    text-underline-offset: 0.18em;
  }

  .south a:hover { text-decoration-thickness: 2px; }

  .south :focus-visible { outline-color: var(--c-bg); }

  .hello {
    margin: 0;
    font-family: var(--f-serif);
    font-style: italic;
    font-size: clamp(1.25rem, 3vw, 1.75rem);
    line-height: 1.3;
    overflow-wrap: anywhere;
  }

  .coords {
    display: flex;
    justify-content: space-between;
    gap: var(--s-6);
    margin: 0;
  }

  .coords .label { color: inherit; opacity: 0.75; }
  .coords a.label { opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    .word.set, .word.rise { animation: none; }
  }
</style>
</head>
<body>
  <header class="north">
    <div class="languages" role="group" aria-label="Say hello in">
      <button type="button" class="label" data-i="0" aria-pressed="true" lang="es">Español</button>
      <button type="button" class="label" data-i="1" aria-pressed="false" lang="fr">Français</button>
      <button type="button" class="label" data-i="2" aria-pressed="false">English</button>
      <button type="button" class="label" data-i="3" aria-pressed="false"><span lang="de">Deutsch</span> <small>learning</small></button>
    </div>
    <h1><span class="word" lang="es">Hola</span><span class="visually-hidden">, I’m José.</span></h1>
  </header>

  <main class="south">
    <div>
      <p class="name" aria-hidden="true">I’m José.</p>
      <p class="hello"><a href="mailto:hello@josemanosalvas.ch">hello@josemanosalvas.ch</a></p>
    </div>
    <p class="coords">
        <span class="label tnum">0°00′00″ → Switzerland</span>
        <a class="label" href="https://github.com/josemanosalvas">GitHub</a>
    </p>
  </main>

<script>
  (() => {
    const greetings = [
      { word: 'Hola', lang: 'es' },
      { word: 'Salut', lang: 'fr' },
      { word: 'Hi', lang: 'en' },
      { word: 'Salü', lang: 'gsw' },
    ];
    const word = document.querySelector('.word');
    const heading = document.querySelector('h1');
    const buttons = [...document.querySelectorAll('.languages button')];
    const reduce = matchMedia('(prefers-reduced-motion: reduce)');
    let current = 0, timer = null, chosen = false, busy = false;

    function paint(i) {
      word.textContent = greetings[i].word;
      word.lang = greetings[i].lang;
      buttons.forEach((b, n) => b.setAttribute('aria-pressed', String(n === i)));
    }

    function go(i) {
      if (i === current || busy) return;
      current = i;
      if (reduce.matches) { paint(i); return; }
      busy = true;
      word.className = 'word set';
      setTimeout(() => {
        paint(i);
        word.className = 'word rise';
        setTimeout(() => { word.className = 'word'; busy = false; }, 900);
      }, 520);
    }

    function start() {
      if (timer || chosen || reduce.matches || document.hidden) return;
      timer = setInterval(() => go((current + 1) % greetings.length), 3200);
    }
    function stop() { clearInterval(timer); timer = null; }

    buttons.forEach((b) => b.addEventListener('click', () => {
      chosen = true; stop(); go(Number(b.dataset.i));
    }));
    heading.addEventListener('mouseenter', stop);
    heading.addEventListener('mouseleave', start);
    document.addEventListener('visibilitychange', () => (document.hidden ? stop() : start()));

    // First light: the opening greeting rises once on load.
    if (!reduce.matches) {
      word.className = 'word rise';
      busy = true;
      setTimeout(() => { word.className = 'word'; busy = false; start(); }, 900);
    }
  })();
</script>
</body>
</html>
